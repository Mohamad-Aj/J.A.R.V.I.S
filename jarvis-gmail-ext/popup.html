<!DOCTYPE html>
<html>

<head>
  <title>JARVIS Email Assistant</title>
  <style>
    body {
      font-family: Arial;
      padding: 10px;
      width: 300px;
    }

    textarea {
      width: 100%;
      height: 100px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>

<body>
  <h3>Write with JARVIS</h3>
  <textarea id="prompt" placeholder="e.g. Apologize for being late..."></textarea>
  <button id="generate">Generate Email</button>
  <div id="output"></div>

  <script src="popup.js"></script>
</body>

</html>
